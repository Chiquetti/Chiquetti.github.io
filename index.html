<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victor Chiquetti</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="Victor Chiquetti, Orlando FL.">
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 640px; margin: 0 auto; padding: 48px 20px; font-family: "Times New Roman", Times, serif; font-size: 20px; line-height: 1.5; }
    h1 { font-size: 2.4rem; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>My name is Victor Chiquetti.</p>
  <p>
    <a href="https://github.com/Chiquetti" rel="noopener">GitHub</a> ·
    <a href="https://www.linkedin.com/in/victorchiquetti/" rel="noopener">LinkedIn</a> ·
    <a href="https://cwdigitalmarketing.agency" rel="noopener">CW Digital Marketing</a>
  </p>
  <script>
    // Favicon que alterna entre VC preto e VC amarelo (PNG gerado no navegador).
    (function () {
      // Cada quadro: fundo, cor do texto, conteúdo. VC preto, mão no preto, VC amarelo, mão no amarelo.
      var frames = [["#111", "#fff", "VC"], ["#111", "#fff", "\ud83d\udc4b"], ["#ffd400", "#111", "VC"], ["#ffd400", "#111", "\ud83d\udc4b"]];
      var urls = frames.map(function (f) {
        var c = document.createElement("canvas");
        c.width = c.height = 64;
        var x = c.getContext("2d");
        x.fillStyle = f[0];
        x.beginPath();
        x.roundRect ? x.roundRect(0, 0, 64, 64, 12) : x.rect(0, 0, 64, 64);
        x.fill();
        x.fillStyle = f[1];
        x.textAlign = "center";
        if (f[2] === "VC") {
          x.font = "bold 30px 'Times New Roman', Times, serif";
          x.fillText("VC", 32, 43);
        } else {
          x.font = "40px sans-serif";
          x.fillText(f[2], 32, 46);
        }
        return c.toDataURL("image/png");
      });
      function set(url) {
        document.querySelectorAll("link[rel~='icon']").forEach(function (l) { l.remove(); });
        var l = document.createElement("link");
        l.rel = "icon"; l.type = "image/png"; l.href = url;
        document.head.appendChild(l);
      }
      set(urls[0]);
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var i = 0;
      setInterval(function () { i = (i + 1) % urls.length; set(urls[i]); }, 1200);
    })();
  </script>
</body>
</html>
